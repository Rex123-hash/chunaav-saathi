################################################################################
# Cloud Build CI/CD — Chunav Saathi
# Triggered on push to main branch
# Required substitution vars (set in Cloud Build trigger or cloudbuild.yaml):
#   _REGION          e.g. asia-south1
#   _SERVICE_NAME    e.g. chunav-saathi
#   _PROJECT_ID      GCP project ID (auto-populated as $PROJECT_ID)
################################################################################

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: chunav-saathi
  _IMAGE: gcr.io/$PROJECT_ID/${_SERVICE_NAME}

steps:
  # ── Step 1: Build the container image ─────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=${_IMAGE}:$SHORT_SHA
      - --tag=${_IMAGE}:latest
      - --cache-from=${_IMAGE}:latest      # layer cache from last build
      - .

  # ── Step 2: Push both tags ─────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - ${_IMAGE}

  # ── Step 3: Deploy to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NODE_ENV=production
      - --quiet

images:
  - ${_IMAGE}:$SHORT_SHA
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8    # faster builds

timeout: 900s   # 15 min cap
