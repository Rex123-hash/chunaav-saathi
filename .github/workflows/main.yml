name: Chunav Saathi CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Security Audit ───────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+ severity)
        run: npm audit --audit-level=high

      - name: Check for secrets in codebase
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true   # Advisory — don't block CI on new projects

  # ── Job 2: Lint & Quality ───────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (src)
        run: |
          find src -name "*.js" | xargs node --check
          echo "✅ All source files pass syntax check"

      - name: Syntax check (tests)
        run: |
          find tests -name "*.js" | xargs node --check
          echo "✅ All test files pass syntax check"

      - name: Check repo size
        run: npm run check-size

      - name: Verify .env is not committed
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ .env file is tracked by git — remove it immediately!"
            exit 1
          fi
          echo "✅ No .env file committed"

      - name: Verify no hardcoded secrets
        run: |
          # Fail if any real-looking API key patterns are found in source files
          if git grep -r --include="*.js" --include="*.json" --include="*.yaml" \
            -E "AIzaSy[A-Za-z0-9_-]{33}" -- \
            ':!node_modules' ':!.env.example' ':!package-lock.json'; then
            echo "❌ Possible hardcoded Google API key detected in source!"
            exit 1
          fi
          echo "✅ No hardcoded API keys found"

  # ── Job 3: Unit Tests ───────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      GEMINI_API_KEY:          "test-key-not-real"
      FIRESTORE_EMULATOR_HOST: "localhost:8080"
      GCLOUD_PROJECT:          "chunav-saathi-test"
      NODE_ENV:                "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --reporter=spec

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "*.xml"
          if-no-files-found: ignore

  # ── Job 4: Integration Tests ─────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    env:
      GEMINI_API_KEY:          "test-key-not-real"
      FIRESTORE_EMULATOR_HOST: "localhost:8080"
      GCLOUD_PROJECT:          "chunav-saathi-test"
      NODE_ENV:                "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI (for Firestore emulator)
        run: npm install -g firebase-tools

      - name: Start Firestore Emulator & run integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project chunav-saathi-test \
            "npm run test:integration -- --reporter=spec"

  # ── Job 5: Build Validation ──────────────────────────────────────────────────
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Smoke test — server starts and exits cleanly
        run: |
          GEMINI_API_KEY=test-key \
          GCLOUD_PROJECT=test \
          NODE_ENV=production \
          timeout 5 node -e "
            const app = require('./src/index');
            setTimeout(() => { console.log('✅ Server module loaded cleanly'); process.exit(0); }, 1000);
          "

      - name: Validate Dockerfile exists
        run: test -f Dockerfile && echo "✅ Dockerfile present"
